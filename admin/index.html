<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111111"><title>Hi-Mundim | Rádio Admin</title><link rel="stylesheet" href="/styles.css"></head>
<body class="admin-body">
<header class="topbar"><a class="brand" href="/"><span class="brand-kicker">HI-MUNDIM</span><strong>RÁDIO ADMIN</strong></a><button id="logoutBtn" class="btn secondary hidden" type="button">Sair</button></header>
<main class="admin-shell">
<section id="loginCard" class="admin-card" style="max-width:520px;margin:40px auto"><h2>Entrar no estúdio</h2><div id="loginStatus" class="status-box">Use o usuário administrador do Firebase.</div><div class="form-grid"><div class="field full"><label>E-mail</label><input id="email" type="email" autocomplete="username"></div><div class="field full"><label>Senha</label><input id="password" type="password" autocomplete="current-password"></div></div><div class="btn-row"><button id="loginBtn" class="btn" type="button">Entrar</button></div></section>
<section id="studio" class="hidden"><div id="adminStatus" class="status-box">Carregando rádio…</div><div class="admin-grid">
<section class="admin-card"><h2>Ao vivo / fonte imediata</h2><div class="form-grid"><div class="field full"><label>Título no ar</label><input id="liveTitle" placeholder="Ex.: Hi-Mundim ao vivo"></div><div class="field full"><label>URL direta do áudio/stream</label><input id="liveAudioUrl" type="url" placeholder="https://..."></div><div class="field full"><label>Descrição</label><textarea id="liveDescription"></textarea></div></div><div class="btn-row"><button id="liveOnBtn" class="btn">Colocar no ar</button><button id="liveOffBtn" class="btn danger">Encerrar transmissão</button></div></section>
<section class="admin-card"><h2>Cadastrar programa</h2><div class="form-grid"><div class="field full"><label>Título</label><input id="programTitle"></div><div class="field"><label>Categoria</label><select id="programCategory"><option>Caminhos</option><option>Sabores</option><option>Balaio</option><option>Especial</option></select></div><div class="field"><label>Publicado</label><select id="programPublished"><option value="true">Sim</option><option value="false">Não</option></select></div><div class="field full"><label>URL direta do áudio</label><input id="programAudioUrl" type="url"></div><div class="field full"><label>Descrição</label><textarea id="programDescription"></textarea></div></div><div class="btn-row"><button id="saveProgramBtn" class="btn">Salvar programa</button></div></section>
<section class="admin-card"><h2>Agendar programa</h2><div class="form-grid"><div class="field full"><label>Programa</label><select id="scheduleProgram"></select></div><div class="field"><label>Início</label><input id="scheduleStart" type="datetime-local"></div><div class="field"><label>Fim</label><input id="scheduleEnd" type="datetime-local"></div></div><div class="btn-row"><button id="saveScheduleBtn" class="btn">Adicionar à programação</button></div></section>
<section class="admin-card"><h2>Estado da rádio</h2><div id="liveState" class="status-box">—</div><div id="scheduleAdminList" class="admin-list"></div></section>
<section class="admin-card full"><h2>Biblioteca de programas</h2><div id="programAdminList" class="admin-list"></div></section>
</div></section></main>
<script src="https://www.gstatic.com/firebasejs/12.6.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.6.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.6.0/firebase-database-compat.js"></script><script src="/firebase-config.js"></script><script src="/admin/admin.js"></script>
</body></html>
